[package]
name = "soundfx_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clipboard-win = "5"
directories = "5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
hound = "3"
open = "5"
raw-window-handle = "0.6"
rfd = "0.15"
rodio = { version = "0.20", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.2", features = ["native-tls"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = "2"
wasapi = "0.20"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
