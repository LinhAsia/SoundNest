[package]
name = "soundfx_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clipboard-win = "5"
directories = "5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
hound = "3"
open = "5"
raw-window-handle = "0.6"
regex = "1"
rfd = "0.15"
rodio = { version = "0.20", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.2", features = ["native-tls"] }
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = "2"
wasapi = "0.20"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
